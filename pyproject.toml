[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web3-secops-lab"
version = "0.1.0"
description = "A hands-on Web3 security operations lab. Week 1: process startup, config loading, and structured logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SangJieGe" }]
keywords = ["web3", "security", "secops", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

# Week 1 程序真正需要的依赖：读取 .env 配置。
# 其余依赖（httpx / pyyaml / pydantic / structlog 等）等对应功能实现时再加。
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/SangJieGe/web3-secops-lab"
Repository = "https://github.com/SangJieGe/web3-secops-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/web3_secops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
