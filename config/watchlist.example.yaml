# =============================================================================
# Web3 SecOps Lab — Watchlist (EXAMPLE)
# Copy to `config/watchlist.yaml` and edit. The real file is gitignored.
# =============================================================================

# Chains this watchlist applies to. Each entry maps to an RPC URL in .env.
chains:
  - name: ethereum
    chain_id: 1
    rpc_env: ETHEREUM_RPC_URL
    enabled: true
  - name: base
    chain_id: 8453
    rpc_env: BASE_RPC_URL
    enabled: false

# Addresses to actively monitor. Any interaction involving them raises an alert.
addresses:
  - address: "0x0000000000000000000000000000000000000001"   # placeholder — replace
    label: "Example Treasury Multisig"
    chain: ethereum
    severity: high
    tags: [treasury, multisig]
    # Alert on ANY transfer in or out
    watch_inbound: true
    watch_outbound: true

  - address: "0x0000000000000000000000000000000000000002"   # placeholder — replace
    label: "Example Admin EOA"
    chain: ethereum
    severity: critical
    tags: [admin]
    watch_inbound: true
    watch_outbound: true

# Contracts whose events we decode. Attach an ABI file in `contracts/`.
contracts:
  - address: "0x0000000000000000000000000000000000000003"   # placeholder — replace
    label: "Example Token"
    chain: ethereum
    abi: "contracts/erc20.abi.json"
    events:
      - Transfer
      - Approval
      - OwnershipTransferred

# Known-bad / high-privilege contracts. Interaction with these is auto-flagged.
flagged_contracts:
  - address: "0x0000000000000000000000000000000000000004"   # placeholder
    label: "Example Flagged (mixer / sanctioned)"
    chain: ethereum
    reason: "sanctioned-entity"
    severity: critical

# Detection thresholds (override .env defaults per-chain if desired)
thresholds:
  min_notable_value: 10          # native token units
  large_transfer_usd: 100000     # requires price oracle if enabled
  rapid_drain_count: 3           # N outbound txs within rapid_drain_window
  rapid_drain_window_seconds: 300

# Alert routing
alerts:
  sink: file                      # file | webhook | wazuh
  file_path: ./logs/alerts.jsonl
  min_severity: medium            # low | medium | high | critical
