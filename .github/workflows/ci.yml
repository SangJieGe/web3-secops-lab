name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A read-only collector needs no write access to anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests (offline, mocked RPC only)
        # The suite must never reach the public internet: every RPC call is
        # intercepted by respx. Any accidental live call would fail the job.
        run: pytest -q --disable-warnings

      # Scope: this checks one thing only — that no file literally named `.env`
      # is tracked by git. It does NOT scan file contents, does NOT detect
      # embedded credentials in source, and is NOT secret scanning. Treating a
      # green run here as "no secrets in the repo" would be wrong.
      - name: Guard — no tracked .env file
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must not be committed"
            exit 1
          fi
          echo "no .env tracked — ok (tracked-file check only)"
