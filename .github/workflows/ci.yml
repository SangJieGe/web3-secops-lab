name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A read-only collector needs no write access to anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: "Tests (offline: mocked RPC + loopback HTTP)"
        # No public network is used. Two mechanisms are involved, not one:
        #   * in-process RPC calls are intercepted by respx — a missed mock fails
        #     the test rather than dialling out;
        #   * entrypoint tests run a real `python -m` subprocess with a real HTTP
        #     client, but against tests/local_rpc_server.py bound to 127.0.0.1.
        # Either way an accidental call to a public endpoint would fail the job.
        run: pytest -q --disable-warnings

      # Scope: this checks one thing only — that no file literally named `.env`
      # is tracked by git. It does NOT scan file contents, does NOT detect
      # embedded credentials in source, and is NOT secret scanning. Treating a
      # green run here as "no secrets in the repo" would be wrong.
      - name: Guard — no tracked .env file
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must not be committed"
            exit 1
          fi
          echo "no .env tracked — ok (tracked-file check only)"
